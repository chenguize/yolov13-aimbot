[General]
screen_width          = 1920
screen_height         = 1080
capture_size          = 256
capture_fps_target    = 240
enable_aimbot         = True
enable_triggerbot     = True

[Inference]
model_path            = models/best256.engine
conf_threshold        = 0.38
iou_threshold         = 0.45
max_det               = 20
[Kalman]
R=2.0
Q_pos=2.0
q_vel =  30.0
q_acc =  150.0

[WorldModel]
# [新参数] 硬件固有延迟 (USB + 显示器)，物理死值，通常 10-15ms
base_hardware_lag = 0.015


[AimStrategy]
strategy_package      = valorant
enable_auto_calibration = False
k_factor_x            = 3.4
k_factor_y            = 3.4
#2.56/3.4
[Controller]
controller_type       = pro
mode_threshold_high = 50.0
mode_threshold_low =  35.0
max_speed = 15000.0
max_accel = 250000.0
horizon = 18
samples = 80
w_pos = 35.0
w_vel = 0.001
w_acc = 1e-5
Kp = 1200.0
Kd = 35.0
[Triggerbot]
# 扳机专用 FOV，极小，用于判定是否开火
trigger_fov_x         = 4.0
trigger_fov_y         = 4.0
trigger_conf_threshold= 0.50

[Debug]
enable_trace          = False
log_level             = INFO