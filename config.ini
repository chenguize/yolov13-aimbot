[General]
screen_width          = 1920
screen_height         = 1080
capture_size          = 256
capture_fps_target    = 240
enable_aimbot         = True
enable_triggerbot     = True

[Inference]
model_path            = models/best256.engine
conf_threshold        = 0.38
iou_threshold         = 0.45
max_det               = 20

[WorldModel]
# --- Phase 4 认知参数 ---
# 自瞄搜索范围 (相对于 256 截图中心的偏移量)
search_fov            = 100.0

# 预测开关
enable_prediction     = False
system_latency        = 0.045

# 感知滞后模拟 (ms)
perception_lag_ms     = 0.0

# 拟人化偏移 (随机不锁头)
enable_neck_offset    = False
neck_offset_prob      = 0.40

# 机会浪费 (模拟犹豫)
enable_chance_waste   = False
chance_waste_prob     = 0.05

# 状态估计噪声
kalman_R_pos          = 5.0
kalman_Q_proc         = 0.5

[AimStrategy]
strategy_package      = valorant
enable_auto_calibration = False
k_factor_x            = 4.5
k_factor_y            = 4.5

[Controller]
controller_type       = simple
fitts_a               = 0.12
fitts_b               = 0.05
enable_biometric_noise= True
max_step              = 300.0

[Triggerbot]
# 扳机专用 FOV，极小，用于判定是否开火
trigger_fov_x         = 4.0
trigger_fov_y         = 4.0
trigger_conf_threshold= 0.50

[Debug]
enable_trace          = True
log_level             = INFO