# config.ini
# YOLOv13 Aimbot 高阶异步工程版配置 - 2025.12
# 所有高级功能默认关闭，请按需逐项开启测试

[General]
# 屏幕分辨率（用于坐标转换、FOV计算等）
screen_width          = 1920
screen_height         = 1080

# 捕获模式（目前主要支持鼠标中心256×256）
capture_size          = 256
capture_fps_target    = 360           ; 目标采集帧率（实际受硬件限制）

# 是否强制使用屏幕中心代替鼠标位置（VALORANT正常情况可开启）
use_screen_center_instead = false
; 功能开关 - 核心功能独立控制
enable_aimbot         = false         ; 自瞄（鼠标移动到目标）
enable_triggerbot     = false         ; 自动扳机（准星在目标上自动开火）


[Inference]
model_path            = models/best256.engine
conf_threshold        = 0.38
iou_threshold         = 0.45          ; 如果在后处理做NMS时使用
max_det               = 20            ; 每帧最多保留的检测数

[Perception]
ego_motion_compensation = false       ; 自运动补偿（最高优先级优化）

[WorldModel]
enable_multitrack     = false         ; 多目标跟踪 + 状态机
track_iou_threshold   = 0.45
track_max_age         = 1.2           ; 秒，丢失后保持时间
ekf_extrapolation     = false         ; 卡尔曼/扩展状态预测

[Controller]
controller_type       = simple        ; 可选: simple, pid, advanced
sensitivity           = 0.42          ; simple模式下的基础灵敏度
use_desired_velocity  = false         ; 输出期望速度×dt（更平滑）
use_nonlinear_zone    = false         ; 大误差S曲线，小误差强阻尼
use_jerk_limited      = false         ; 加加速度限制轨迹平滑

[Humanize]
enable_reaction_delay = false
reaction_delay_min_ms = 40
reaction_delay_max_ms = 120

enable_fatigue        = false
enable_overshoot      = false
enable_noise          = false
noise_level           = 0.12          ; 像素级噪声强度（0~1）

enable_curve          = false         ; 鼠标移动曲线形状（ease-in-out等）

[Output]
enable_micro_move_merge = false       ; 亚像素累积+小移动合并
micro_move_threshold  = 0.8           ; 像素，小于此值累积不发送

enable_deadzone       = false
deadzone_pixels       = 1.2           ; 小于此值不发送移动

output_rate_limit_hz  = 250           ; 输出频率上限

[Triggerbot]
trigger_delay_min_ms  = 15            ; 最小反应延迟（ms）
trigger_delay_max_ms  = 80            ; 最大随机延迟（ms） - 更像人
trigger_fov           = 15            ; 扳机判定FOV（像素半径，越小越严格）
trigger_conf_threshold= 0.55          ; 扳机需要更高的置信度
trigger_hold_time_ms  = 40            ; 按住左键时间（ms）- 模拟点射/连发
trigger_key           = 1             ; 1=鼠标左键, 2=右键, 其他=键盘键码（暂不支持）
trigger_mode          = on_crosshair  ; 可选: on_crosshair / always / toggle