# =========================================================
#  AIMBOT SYSTEM CONFIG  (LQR v4 - CMA-ES 最优参数 得分31.96)
#  生成日期: 基于 2026-02-27 炼丹结果
# =========================================================

[General]
screen_width           = 1920
screen_height          = 1080
capture_size           = 256
capture_fps_target     = 240
enable_aimbot          = True
enable_triggerbot      = True

# =========================================================
#  Inference
# =========================================================
[Inference]
model_path             = models/best256_yolo26.engine
conf_threshold         = 0.38
iou_threshold          = 0.45
max_det                = 20

# =========================================================
#  Kalman Filter (保持原值或上次较好值，未在此轮炼丹覆盖)
# =========================================================
[Kalman]
R                      = 1.726028
Q_pos                  = 10.4587
Q_vel                  = 49.8483
Q_acc                  = 252.0694

# =========================================================
#  World Model
# =========================================================
[WorldModel]
base_hardware_lag      = 0.019
moonlight_latency_ms   = 0.0
virtualhere_latency_ms = 0.0

# =========================================================
#  Aim Strategy
# =========================================================
[AimStrategy]
strategy_package       = valorant
enable_auto_calibration = False
k_factor_x             = 3.4
k_factor_y             = 3.4
fixed_lead_time        = 0.019

# =========================================================
#  Controller (PROController LQR v4 - CMA-ES 最优参数)
# =========================================================
[Controller]
controller_type        = pro

# 物理与极限
max_accel              = 126684.7
max_speed              = 9523.1

# 拟人手腕阻尼 (抑制高频颤抖的核心)
wrist_alpha            = 0.2207

# 生理反应硬直
coldstart_ramp_ms      = 89.5

# LQR TRACK 大脑刚性配置
q_pos_track            = 31.3720
q_vel_track            = 0.6658
r_track                = 5.7226e-05

# LQR FLICK 甩枪刚性配置
q_pos_flick            = 12.7504
q_vel_flick            = 3.0968e-04
r_flick                = 1.1982e-07

# LQI 积分与辅助动力学
ki_gain                = 0.0205
ff_acc_gain            = 0.1465
blend_dist             = 50.0
deadzone_scale         = 0.1177
velocity_friction      = 0.9805

# Flick 结束时的手刹阻尼
flick_end_damp         = 0.30

# =========================================================
#  Triggerbot
# =========================================================
[Triggerbot]
trigger_fov_x          = 4.0
trigger_fov_y          = 4.0
trigger_conf_threshold = 0.50

# =========================================================
#  Debug
# =========================================================
[Debug]
enable_trace           = False
log_level              = INFO