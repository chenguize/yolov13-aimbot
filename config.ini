# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║                      快速上手 —— 改这 10 个就够了                             ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# 1. [General]    capture_size          = 256     # 截图分辨率
# 2. [Inference]  backend               = opencv  # yolo / opencv(色球)
# 3. [Inference]  model_path            = ...     # YOLO 模型路径（opencv 时忽略）
# 4. [WorldModel] predict_ahead         = True    # 时间前视（开=跟动目标，关=A/B 对照）
# 5. [WorldModel] base_hardware_lag     = 0.0     # 本机硬件延迟(秒)，0=测试/本机
# 6. [WorldModel] moonlight_latency_ms  = 0.0     # 串流延迟，0=本机，20-50=Moonlight
# 7. [AimStrategy]bypass_strategy_mapping=True   # True=1px≈1count 调试，False=瓦实战
# 8. [Controller] controller_type       = pro     # pro(CIPHER) / simple / pid
# 9. [General]    min_aim_conf          = 0.32    # 锁目标最低置信
# 10.[Debug]      log_level             = INFO    # DEBUG / INFO / WARNING
#
# ══════════════════════════════════════════════════════════════════════════════════
# § 以下全部参数已工作良好，日常无需修改。调参/极客进阶时再碰。
# ══════════════════════════════════════════════════════════════════════════════════


# ═══════════════════════════════════════════════════════════════════════════════
#  General —— 屏幕 / 游戏 / 瞄准 / 人机意图 / 输入
# ═══════════════════════════════════════════════════════════════════════════════
[General]
# ── 屏幕 & 游戏 ──
screen_width           = 1920
screen_height          = 1080
game_fov               = 103.0          # 游戏内 FOV（Valorant 默认 103，CS2 可设 90）
capture_size           = 256            # 截图方形尺寸(px)
capture_fps_target     = 240            # 截图线程目标帧率
current_game           = valorant       # 当前游戏（默认 valorant）

# ── 瞄准锁定 ──
min_aim_conf           = 0.32           # 首次/失锁后锁目标需检测置信 ≥ 此值
min_aim_conf_drop      = 0.20           # 已锁目标置信跌破此值才丢弃（需 < min_aim_conf）
aim_drop_invalid_frames = 2             # 连续无效帧数达此才拆锁（Aimlab 自动抬高到 3）
aim_lock_confirm_count = 3              # 首锁需连续 N 帧有效（防单帧噪声误锁）

# ── 人机意图追踪 —— 方向感知融合：对抗快升 / 配合慢降 / 静止衰减 ──
intent_speed_deadzone_px_s = 4.0        # 速度死区(px/s)：低于此视为「没在动」
intent_attack_rate     = 5.0            # 对抗时意图上升速率(/s)，~0.2s 满格
intent_decay_rate      = 1.5            # 静止时意图衰减速率(/s)，~0.7s 回 AI 全控
intent_oppose_cos_threshold  = -0.15    # 内积<此→对抗（反方向）
intent_cooperate_cos_threshold = 0.35   # 内积>此→配合（同方向）
# 紧急通道：人手快甩+方向对抗→瞬间全权接管（不走平滑融合，无"吸住"感）
intent_emergency_speed_px_s = 1500.0    # 速度门槛(px/s)，>此+对抗=进紧急
intent_emergency_exit_speed_px_s = 400.0 # 退出紧急的速度门槛（瞬时人速）
intent_emergency_exit_hold_s = 0.08    # 手停后仍保持全权最长时间；过长会 ai_w=0 抽搐
intent_emergency_persist_frames = 6      # persist 兜底帧数（高速甩枪仍可用 EMA>emergency_speed 直接进紧急）
intent_emergency_persist_dist_px = 55.0  # persist 累积对抗位移门槛(px)
# 人速估计窗(s)：Intent 用 RingBuffer 位移/窗长，抑 pynput 单帧尖峰
intent_human_vel_window_sec = 0.032
# 紧急入口判定用人速 EMA 时间常数(s)，抑瞬时噪声误触 emergency_speed
intent_emergency_spd_ema_tau_sec = 0.045
# 低于此人速不计入 persist（微抖/减账残差）
intent_persist_min_speed_px_s = 280.0
# 准星误差大于此：禁止 persist 进紧急（大误差「对抗」常为扫视或减账残留；真甩枪仍看 EMA>1500）
intent_skip_persist_emergency_dist_px = 95.0
intent_safety_max_ai_power = 0.30       # 安全包络：非紧急时 AI 功率上限(0=关闭)
intent_safety_engage_score = 0.20       # 安全包络触发阈值（人手控制强度）

# ── 扳机 ──
enable_triggerbot      = False

# ── 人手输入 ──
human_input_backend    = pynput         # inputs(RAW 硬件轴) / pynput(屏坐标)
human_intent_subtract_ai = True         # pynput 下扣除 AI 位移，防方向/速度被 AI 污染


# ═══════════════════════════════════════════════════════════════════════════════
#  Inference —— 检测后端
# ═══════════════════════════════════════════════════════════════════════════════
[Inference]
backend                = opencv         # yolo(TensorRT) / opencv|aimlab|hsv(色球)
model_path             = models/best256_yolo26.engine   # YOLO 模型（色球时忽略）
conf_threshold         = 0.38           # YOLO 检测置信门槛（色球由面积公式自动生成 >0.35）
max_det                = 20             # 最大检测框数


# ═══════════════════════════════════════════════════════════════════════════════
#  Kalman Filter —— 位置/速度/加速度估计
# ═══════════════════════════════════════════════════════════════════════════════
[Kalman]
R                      = 1.726028       # 量测噪声协方差（观测不确定性）
Q_pos                  = 10.4587        # 过程噪声：位置
Q_vel                  = 49.8483        # 过程噪声：速度
Q_acc                  = 252.0694       # 过程噪声：加速度


# ═══════════════════════════════════════════════════════════════════════════════
#  World Model —— 预测 / 延迟自适应 / 多目标追踪
# ═══════════════════════════════════════════════════════════════════════════════
[WorldModel]
# ── 延迟配置（本机/串流/WAN）──
base_hardware_lag      = 0.0            # 本机硬件刚性延迟(秒)：GPU→屏 通常 0.005-0.015
moonlight_latency_ms   = 0.0            # 串流延迟(ms)：Moonlight/Parsec 典型 20–50
virtualhere_latency_ms = 0.0            # USB 透传额外延迟(ms)，一般 0–8
wan_mode               = False          # 远程串流模式（放宽延迟范围到 5-150ms）
wan_min_latency_ms     = 20.0           # WAN 最小延迟地板(ms)
wan_jitter_ms          = 10.0           # WAN 预期抖动幅度(ms)

# ── 核心开关 ──
predict_ahead          = False           # 时间前视（v·T + ctrl_lead）→ 跟动目标
use_total_delta        = True           # 准星追踪含 AI 位移（True=全量，防泄漏进 Kalman）
adaptive_latency_enable = True          # 自适应延迟引擎（Kalman 残差动态调 vh 延迟）
ctrl_lead_enable       = True           # 复合 lead 含控制器执行时长（BALLISTIC/TRACKING）
# 零延迟本机（base_hardware≤0 且无串流）：削弱 v·lead 近距过冲；动目标仍保留可观 lead
zero_latency_ctrl_lead_cap_s = 0.085     # ctrl_lead 上限(s)，原 0.15 易顶满→标点飞过
zero_latency_max_smart_lead_s = 0.110    # software_lag+ctrl_lead 总上限(s)
zero_latency_vel_damp_start_px = 24.0    # 准星-目标距≤此：速度前视至少压到 vel_damp_min
zero_latency_vel_damp_full_px = 140.0   # 距≥此：速度前视系数≈1
zero_latency_vel_damp_min = 0.20       # 近距 v·T 不低于该比例（0=可关死，易拖尾）

# ── 多目标追踪（TrackManager: IoU + Kalman 池）──
track_selection_policy = closest_to_crosshair   # 选目标策略：closest_to_crosshair | highest_conf | newest | largest
track_iou_threshold    = 0.25           # IoU 匹配阈值(0=极宽松，0.5=保守)
track_max_coast        = 24             # 失配 coast 帧上限；Aimlab 丢检/低 fps 时 8 易整轨删掉→刷 ID
track_max_tracks       = 12             # 最大同时活跃轨迹数
track_center_match_max_px = 48.0        # 框心弱匹配最大距离(px)，0=仅用 IoU
# hard_assign=false 时：仅当 预测距≤此 才强制同轨；hard_assign=true 时本项仅作备用
track_single_det_gate_px = 90.0
# 仅 1 检测：并入预测最近轨，禁止为此 spawn（Aimlab 单球建议 true；多目标异常合并时改 false）
track_single_det_hard_assign = true
# 单球：测量离「上一帧 best 轨」预测≤此(px) 时强制并轨，避免幽灵近邻抢匹配
track_single_det_sticky_px = 150.0
track_select_sticky_px = 22.0           # sticky：上一帧 best 比几何最近多这么多(px)也不切

# ── WorldModel 粘滞（多目标 conf 接近时防框心跳变）──
sticky_target_enable   = True
sticky_conf_margin     = 0.10           # 上一帧首选在 conf 前 top margin 内才粘滞
sticky_max_center_px   = 120.0          # 上一帧首选框心位移超此则放弃粘滞

# ── 目标过滤 ──
aim_target_classes     = 0              # 只跟踪这些 class(逗号分隔)，空=全部。色球=0


# ═══════════════════════════════════════════════════════════════════════════════
#  Aim Strategy —— 像素↔Count 映射
# ═══════════════════════════════════════════════════════════════════════════════
[AimStrategy]
strategy_package       = valorant
enable_auto_calibration = False
# True → 绕开 FOV 非线性 + k_factor，1px≈1count（调试/AimLab 练枪）
# False → 瓦罗兰特实战映射（FOV + k_factor 生效）
bypass_strategy_mapping = True
k_factor_x             = 1              # bypass=False 时生效：px→count X 轴缩放
k_factor_y             = 1              # bypass=False 时生效：px→count Y 轴缩放


# ═══════════════════════════════════════════════════════════════════════════════
#  Controller
# ═══════════════════════════════════════════════════════════════════════════════
[Controller]
controller_type        = pro            # pro(CIPHER) / simple / pid
rust_enable            = False          # 启用 Rust 原生引擎（需编译: maturin develop --release）

# ── 通用参数 ──
mode_threshold_high    = 50.0           # flick↔track 切换高阈值(px)
mode_threshold_low     = 35.0           # flick↔track 切换低阈值(px)
depth_ref_bbox         = 72.0           # 近距"深度"标定 bbox(px)
flick_end_damp         = 0.30           # 甩枪尾段手刹阻尼
max_backlog_age        = 0.25           # BaseController 最大回溯年龄(s)

# ── CIPHER v1.0 控制器（CMA-ES 最优参数，默认已优无需修改）────────────────────
cipher_max_speed       = 15448.2        # 最大速度(counts/s)
cipher_k_correction    = 91.7348        # CORRECTION 刚度 K
cipher_k_pursuit       = 81.3299        # PURSUIT 刚度 K
cipher_k_flick         = 316.552        # FLICK 刚度 K
cipher_b_correction    = 0.434026       # CORRECTION 阻尼 B
cipher_b_pursuit       = 0.534596       # PURSUIT 阻尼 B
cipher_tau_arm         = 0.0130171      # 臂滤波器 τ(s)
cipher_tau_wrist       = 0.00515668     # 腕滤波器 τ(s)
cipher_deadzone_scale  = 0.0535357      # 软死区缩放
cipher_drift_pos_scale = 0.0325861      # 漂移位置缩放
cipher_drift_sigma     = 0.168134       # 漂移 OU σ
cipher_ff_gain         = 0.954462       # 速度前馈增益
cipher_ff_acc_sec      = 0.0296217      # 加速度前馈预看时间(s)
cipher_ff_scale_min    = 0.392075       # 近端前馈下限
cipher_ff_speed_knee   = 499.41         # 前馈速度 knee(ct/s)
cipher_ff_speed_scale  = 2292.72        # 前馈速度缩放(ct/s)
cipher_fitts_a         = 0.0450208      # Fitts 模型 a(s)
cipher_fitts_b         = 0.0525979      # Fitts 模型 b(s/bit)
cipher_fitts_T_min     = 0.0878224      # Fitts 最小时长(s)
cipher_fitts_T_max     = 0.261426       # Fitts 最大时长(s)
cipher_fitts_sigma     = 0.105811       # Fitts 噪声 σ
cipher_undershoot_loc  = 0.0171182      # 欠射 bias（×head_r）
cipher_undershoot_sigma = 3.29215       # 欠射噪声 σ
cipher_thresh_high_px  = 61.4353        # BALLISTIC 触发高阈值(px)
cipher_thresh_low_px   = 22.0326        # BALLISTIC 触发低阈值(px)
cipher_ou_sigma_ball   = 0.201943       # OU 噪声 σ(BALLISTIC)
cipher_ou_sigma_track  = 0.475435       # OU 噪声 σ(TRACKING)
cipher_ou_vel_scale    = 103.811        # OU 速度缩放(counts/s)
cipher_prog_interval   = 0.0474615      # 弹道重规划最小间隔(s)
cipher_ramp_ms         = 46.5529        # 冷启动斜坡时长(ms)
cipher_ramp_min        = 0.708948       # 冷启动斜坡最小值
cipher_entry_ticks     = 12             # MICRO-ADJUST 入口 tick 数
cipher_entry_dz_px     = 2.5            # MICRO-ADJUST 入口死区(px)

# ── 参数降维（设为 0 则使用上方显式参数，>0 则覆写）──
cipher_zeta_correction = 0.0            # B=2ζ√(K·τ_arm)-1, 从 ζ 推导 B
cipher_zeta_pursuit    = 0.0
cipher_thresh_hyst_ratio = 0.0          # thresh_low = thresh_high × ratio
cipher_tau_wrist_ratio   = 0.0          # tau_wrist = tau_arm × ratio

# ── 简单控制器（controller_type=simple/pid 时用）──
pid_kp                 = 0.65
pid_ki                 = 0.02
pid_kd                 = 0.25


# ═══════════════════════════════════════════════════════════════════════════════
#  Triggerbot
# ═══════════════════════════════════════════════════════════════════════════════
[Triggerbot]
trigger_fov_x          = 4.0            # 扳机水平 FOV(px)
trigger_conf_threshold = 0.50           # 扳机最低置信


# ═══════════════════════════════════════════════════════════════════════════════
#  Debug —— 诊断开关（调完改回 False）
# ═══════════════════════════════════════════════════════════════════════════════
[Debug]
log_level              = INFO           # DEBUG / INFO / WARNING
enable_trace           = False          # 保存调试轨迹到 debug_trace.pkl
startup_diag           = True           # 启动时打印 Runtime 摘要
detailed_stats         = True           # 每秒一条 tick 统计 (valid/dets/infer_ema)
tick_wait_timeout_sec  = 2.0            # 等 frame_ready 超时(s)，0=无限等
aim_lock_diag          = False          # 拆锁/首锁原因诊断（定位 Target acquired 刷屏）
aim_reacquire_log      = False          # 多帧重锁时打 INFO 而非 DEBUG
move_emit_diag         = False          # SendInput 累计位移 vs 臂速指令
move_emit_log_interval_sec = 0.2
aim_diagnostics        = False          # 瞄准环路边沿诊断(全量)
aim_diag_warn_only     = True           # 仅高 flip 时 WARN
aim_diag_interval_sec  = 0.4
aim_diag_window        = 24
aim_diag_warn_flips    = 5              # 窗口内 flips 超此→WARN
human_clutch_diag      = True           # 人机意图追踪：score/ai_weight/人手速/AI误差
human_clutch_diag_interval_sec = 0.25
pipeline_latency_log   = True           # 管线延迟：推理/串流/lead/CIPHER 耗时
pipeline_latency_interval_sec = 1.0


# ═══════════════════════════════════════════════════════════════════════════════
#  Test —— 仿真/评测（不影响实战 agent.py）
# ═══════════════════════════════════════════════════════════════════════════════
[Test]
# 纯 AI 评测管道延迟：True=注入模拟延迟，False=零延迟纯测管线 TTK
simulate_stream_latency  = True
simulate_inference_latency = True
print_stream_latency_stats = True

# 仿真延迟参数
stream_base_ms           = 0            # 0=读 moonlight_latency_ms，>0=覆盖
stream_jitter_ms         = 4.0
stream_spike_prob        = 0.04
stream_spike_extra_ms    = 18.0
inference_base_ms        = 3.0          # 推理段延迟 ~N(base, std) ms
inference_std_ms         = 1.5

# 仿真 CV 噪声
cv_noise_level           = 5.0          # 检测位置噪声幅度(px)
cv_dropout_rate          = 0.08         # 随机丢框概率

# 仿真管道延迟对齐（True=忽略 moonlight/base_hardware_lag，只测纯管线）
align_worldmodel_to_zero_sim_delay = True

# pure_ai 拟人反应延迟(s)：0.15=模拟人类认知延迟；0=纯 AI 无延迟评测真实 TTK
pure_ai_reaction_ramp_sec = 0.0
