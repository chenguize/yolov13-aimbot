# config.ini
# YOLOv13 Aimbot Phase 3 完整配置文件 - 2025.12
# 适配 World Model、因果对冲、策略自校准及拟人化

[General]
# 屏幕分辨率（用于坐标转换）
screen_width          = 1920
screen_height         = 1080

# 捕获参数（Phase 3 强制使用中心裁剪）
capture_size          = 256
capture_fps_target    = 240

# 功能总开关
enable_aimbot         = True
enable_triggerbot     = True

[Inference]
# 模型路径（支持 .engine 或 .onnx）
model_path            = models/best256.engine
# 置信度阈值（低于此值的目标会被忽略）
conf_threshold        = 0.38
# NMS IOU 阈值
iou_threshold         = 0.45
# 每帧最大检测数
max_det               = 20

[WorldModel]
# --- Phase 3 核心参数 ---
# [预测开关]
# True = 开启时延预测（打移动靶）。需要精准的 system_latency。
# False = 只打 Kalman 滤波后的当前位置（打急停/微动）。建议调试初期设为 False。
enable_prediction     = False

# [系统总延迟] (秒)
# 包含：采集(5ms) + 推理(10ms) + 传输(5ms) + 显示(10ms) + 鼠标输入延迟
# 典型值：0.035 ~ 0.050 (35ms - 50ms)
system_latency        = 0.045

# [Kalman 噪声参数]
# R (测量噪声): 值越大，越不信观测值，轨迹越平滑但滞后。默认 5.0。
kalman_R_pos          = 5.0
# Q (过程噪声): 值越大，越信物理运动，能跟上急转弯。默认 0.5。
kalman_Q_proc         = 0.5

[AimStrategy]
# 策略包名（对应 aim_strategies/valorant/）
strategy_package      = valorant
enable_auto_calibration = True
# [K-Factor] 像素映射系数 (Counts per Pixel)
# 定义：移动 1 个像素需要发送多少鼠标 Count。
# ⚠️ 极其重要：直接影响“位移对冲”的准确性。
# 如果晃动鼠标时准星在目标周围乱飘，请调整此值。
# 经验值：1920x1080 @ Valorant (DPI 800, Sens 0.3) -> 约为 1.9 (X) / 1.2 (Y)
k_factor_x            = 1.9
k_factor_y            = 1.2

[Controller]
# 控制器类型: simple (调试用) / pid (PID实战用)/pro(顶级)
controller_type       = simple

# [PID 参数] (仅 advanced 模式生效)
pid_kp                = 0.65
pid_ki                = 0.02
pid_kd                = 0.25

# [点射冷却]
enable_burst_cooldown = True
burst_count_threshold = 3
burst_cooldown_seconds= 0.18

[Humanize]
# [拟人化总开关]
# True = 在控制器输出后叠加噪声和抖动，使其看起来不像脚本。
# 会略微降低精准度，但提高安全性。
enable_humanize       = False

# [静态噪声] (高斯随机)
# 模拟手部微颤和传感器误差
enable_noise          = True
noise_level           = 0.2

# [动态抖动] (正弦波叠加)
# 模拟紧张时的手抖，仅在大幅度拉枪时生效
enable_jitter         = False

[Triggerbot]
# 扳机判定范围 (像素)
# 注意：WorldModel 也有 FOV，但那个是用来"锁"的(通常较大)，这个是用来"开枪"的(通常很小)。
trigger_fov_x         = 4.0
trigger_fov_y         = 4.0
trigger_conf_threshold= 0.50

[Output]
# 死区 (像素)
deadzone_pixels       = 0.8

[Debug]
# [追踪回放]
# True = 开启录制，退出时生成 debug_trace.pkl。
# 会消耗少量内存，建议仅在调试“为什么锁不准”时开启。
enable_trace          = False