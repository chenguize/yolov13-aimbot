# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║                 YOLOv13 瞄准辅助 —— 配置文件                                  ║
# ║                                                                            ║
# ║  本文件只保留「功能开关」和少量「硬约束」(屏幕/延迟/检测后端)。                ║
# ║  控制器/滤波器的内部参数已全部移入代码默认值，                                  ║
# ║  调优由 `python test/simulation.py --scenario ...` 自动进行。                 ║
# ║                                                                            ║
# ║  ⛔ 不需要再手工调整：cipher_* / cv_* / stream_jitter_ms 等几十项细节参数        ║
# ╚══════════════════════════════════════════════════════════════════════════════╝


# ═══════════════════════════════════════════════════════════════════════════════
#  Hardware —— 屏幕 / 截图 / 硬件延迟
# ═══════════════════════════════════════════════════════════════════════════════
[Hardware]
# 屏幕分辨率：0 = 启动时自动检测 Windows 主显示器（GetSystemMetrics）
# ⚠️ 注意：自动检测的是 Windows 桌面分辨率，**不等于游戏内渲染分辨率**。
#    多显示器 / 4K屏跑1080P拉伸 / 非全屏时，游戏内渲染分辨率可能与桌面不同，
#    此时请显式设置 game 实际渲染分辨率（不是 Windows 桌面）。
screen_width          = 0              # 0=自动检测；非零=游戏内渲染分辨率 (px)
screen_height         = 0              # 0=自动检测
game_fov              = 103.0          # 游戏内 FOV（Valorant 103, CS2 90）
capture_size          = 256            # 截图方形尺寸(px)
capture_fps_target    = 240            # 截图线程目标帧率
base_hardware_lag     = 0.0            # 本机硬件刚性延迟(秒)，0=测试本机，0.005-0.015=正常 PC


# ═══════════════════════════════════════════════════════════════════════════════
#  Game —— 当前游戏
# ═══════════════════════════════════════════════════════════════════════════════
[Game]
current_game          = valorant       # valorant / cs2


# ═══════════════════════════════════════════════════════════════════════════════
#  Input —— 人手输入
# ═══════════════════════════════════════════════════════════════════════════════
[Input]
human_input_backend   = pynput         # pynput(屏坐标) / inputs(RAW 硬件轴)
human_intent_subtract_ai = True        # 兼容旧通道；pynput 实战由 RingBuffer 逐事件核销 AI 回显

# 鼠标 → 屏幕像素 映射（驱动 k_factor 动态计算）
# 公式：k = (cm_360 × FOV × DPI) / (913.44 × screen_width)
# 瓦 sens=0.4→cm_360=62.5，瓦 sens=0.5→50.0，瓦 sens=1.0→25.0
# CS2(800dpi) sens=1.0→49，CS2 sens=2.0→24.5
# 推荐用 cm360.invertedi.com 或游戏内 sens 换算器实测
mouse_dpi              = 800           # 物理鼠标 DPI
in_game_sens           = 0.4           # 游戏内灵敏度（瓦 0-1 / CS2 0-3 / OW2 0-100 / Apex 0-1000）
k_yx_ratio             = 1.0           # Y/X 灵敏度比修正（多数游戏=1.0；个别 Y/X sens 独立设置时调整）


# ═══════════════════════════════════════════════════════════════════════════════
#  Safety —— 人机接管与最终输出硬门
# ═══════════════════════════════════════════════════════════════════════════════
[Safety]
human_override_window_ms = 30          # 物理鼠标活动检测窗口
human_override_settle_ms = 4           # 等待 AI 回显记账完成，避免 pynput 自触发
human_override_threshold = 1.5         # 超过此 path counts 即视为人工接管
human_override_hold_ms   = 250         # 人手停止后仍保持让权，避免抢鼠标


# ═══════════════════════════════════════════════════════════════════════════════
#  Inference —— 检测后端
# ═══════════════════════════════════════════════════════════════════════════════
[Inference]
backend               = opencv         # yolo(TensorRT) / opencv|aimlab|hsv(色球测试)
model_path            = models/best256_yolo26.engine
conf_threshold        = 0.38           # YOLO 检测置信门槛（色球由面积公式自动生成）
max_det               = 20             # 最大检测框数
aim_target_classes    = 0              # 只跟踪这些 class(逗号分隔)，空=全部。色球=0


# ═══════════════════════════════════════════════════════════════════════════════
#  Latency —— 串流 / 远程延迟
# ═══════════════════════════════════════════════════════════════════════════════
[Latency]
moonlight_latency_ms  = 0.0            # Moonlight 串流延迟，0=本机，20-50=串流
virtualhere_latency_ms = 0.0           # USB 透传额外延迟
wan_mode              = False          # 远程串流模式（放宽延迟范围到 5-150ms）
wan_min_latency_ms    = 20.0           # WAN 最小延迟地板
wan_jitter_ms         = 10.0           # WAN 预期抖动幅度


# ═══════════════════════════════════════════════════════════════════════════════
#  Aim —— 锁目标行为（人最常调的几个参数）
# ═══════════════════════════════════════════════════════════════════════════════
[Aim]
min_aim_conf          = 0.32           # 锁目标最低置信（首次锁/失锁后重锁）
min_aim_conf_drop     = 0.20           # 已锁目标跌破此值才拆锁（须 < min_aim_conf）
aim_lock_confirm_count = 3             # 首锁需连续 N 帧有效（防单帧噪声误锁）
aim_drop_invalid_frames = 2            # 连续无效帧数达此才拆锁

# Fire-gate 死亡确认（开枪后几何变化检测，解决尸体锁定）
# 开枪 → 300ms 确认窗口 → bbox 高度坍缩 / 速度归零 → 确认死亡 → 释放锁定 + 降权
# 组合「开枪事件」与「几何变化」消除纯几何方案的假阳性（蹲下/adad 不误判）
fire_gate_enable       = True           # 开启 fire-gate 死亡确认
fire_gate_duration     = 0.3            # 开枪后确认窗口(秒)，窗口内检测 bbox 坍缩 / 速度归零
fire_gate_height_ratio = 0.6            # bbox 高度 < 开枪前×此比例 → 确认死亡
fire_gate_vel_threshold = 50.0          # 目标速度 < 此值且开枪前 > 此值 → 确认死亡
fire_gate_penalty_duration = 3.0        # 确认死亡后对该 track 降权时长(秒)
fire_gate_detect_manual = True          # 检测人工左键开枪(需 win32api)


# ═══════════════════════════════════════════════════════════════════════════════
#  Strategy —— 像素↔Count 映射（FxWindage / k_factor）
# ═══════════════════════════════════════════════════════════════════════════════
[Strategy]
strategy_package      = valorant       # valorant
bypass_strategy_mapping = False        # True=1px≈1count 调试/AimLab；False=瓦实战 FOV 映射
                                      # k_factor 由 [Input] 的 mouse_dpi + in_game_sens 动态计算，无需手动设置


# ═══════════════════════════════════════════════════════════════════════════════
#  WorldModel —— 预测/多目标追踪（功能开关）
# ═══════════════════════════════════════════════════════════════════════════════
[WorldModel]
predict_ahead         = False          # 时间前视（v·T + ctrl_lead）→ 跟动目标
use_imm               = False          # IMM-Kalman（动目标变向场景速度收敛 100ms→40ms）
use_total_delta       = True           # 准星追踪含 AI 位移（True=防 Kalman 泄漏）
adaptive_latency_enable = True         # 自适应延迟引擎（Kalman 残差动态调 vh 延迟）
ctrl_lead_enable      = True           # 复合 lead 含控制器执行时长

# 多目标追踪
track_selection_policy = closest_to_crosshair   # closest_to_crosshair | highest_conf | newest | largest
track_max_tracks      = 12             # 最大同时活跃轨迹数
track_max_coast       = 12             # 轨迹池保留；普通输出仍5帧，接管状态可用到12帧
track_single_det_hard_assign = True    # 单检测并入最近轨（Aimlab 建议 True）

# Sticky 目标选择（防框心跳变）
sticky_target_enable  = True


# ═══════════════════════════════════════════════════════════════════════════════
#  Controller —— 控制器选择
# ═══════════════════════════════════════════════════════════════════════════════
[Controller]
controller_type       = pro            # pro(CIPHER) / simple / pid
rust_enable           = False          # Rust 原生引擎（需 maturin develop --release）
cipher_reaction_mean_ms = 122          # 新目标运动启动均值；规划和感知不受限
cipher_reaction_sd_ms = 10             # 职业状态下的试次间波动
cipher_reaction_min_ms = 95            # 防止不符合生理约束的机器瞬启
cipher_reaction_max_ms = 150
cipher_pro_refractory_ms = 58           # 慢/静态目标的事件重规划不应期
cipher_landing_decel = 9000             # 近目标径向制动能力(count/s²)
cipher_landing_radius_mul = 3.0          # 径向制动开始距离(头部半径倍数)
cipher_handoff_blend_ms = 20             # 人手残余速度到AI运动程序的连续混合窗口
cipher_handoff_guard_ms = 100            # 接管初段严格加速度保护窗口
cipher_handoff_max_accel = 1500          # 接管初段最大加速度(count/s²)
cipher_handoff_release_hold_ms = 10      # 严格保护后的连续保持，覆盖边界采样
cipher_handoff_residual_limit = 5000     # 可继承的人手有效方向残余速度上限(count/s)
cipher_handoff_target_speed_limit = 1800 # 首次入窗Kalman速度尚未收敛时的预热限幅
cipher_handoff_open_loop_horizon_ms = 500 # 放手后冻结原语的径向自然闭合时域
cipher_handoff_open_loop_max = 750        # 远端开环径向闭合速度上限(count/s)
cipher_handoff_open_loop_fraction = 0.75  # 反应期最多消耗初始径向误差比例，防开环穿越
cipher_handoff_open_loop_far_max_boost = 50       # 120px远端附加闭合速度
cipher_handoff_open_loop_far_fraction_boost = 0.05 # 120px远端附加误差预算
cipher_handoff_open_loop_far_ratio = 0.60 # 远端约300ms闭合时域，近距离保持500ms精细控制
cipher_handoff_ff_revision_gain = 1.0     # 反应期仅修订目标速度前馈，不开启位置闭环
cipher_handoff_ff_acc_sec = 0.020         # ADAD换向的短时加速度前视(s)
cipher_handoff_target_coast_gain = 0.85  # 不确定速度均值收缩，兼顾持续横移与ADAD反转
cipher_handoff_coast_frames = 12         # 接管开环阶段允许的短丢框帧数(500Hz约24ms)


# ═══════════════════════════════════════════════════════════════════════════════
#  Triggerbot —— 扳机
# ═══════════════════════════════════════════════════════════════════════════════
[Triggerbot]
enable_triggerbot     = False
trigger_fov_x         = 4.0            # 扳机水平 FOV(px)
trigger_conf_threshold = 0.50


# ═══════════════════════════════════════════════════════════════════════════════
#  Debug —— 诊断开关（调完改回 False）
# ═══════════════════════════════════════════════════════════════════════════════
[Debug]
log_level             = INFO           # DEBUG / INFO / WARNING
enable_trace          = False          # 保存调试轨迹到 debug_trace.pkl
startup_diag          = True
detailed_stats        = True
tick_wait_timeout_sec = 2.0
aim_lock_diag         = False          # 拆锁/首锁原因诊断
aim_reacquire_log     = False
move_emit_diag        = False
move_emit_log_interval_sec = 0.2
aim_diagnostics       = False          # 瞄准环路边沿诊断(全量)
aim_diag_warn_only    = True
aim_diag_interval_sec = 0.4
aim_diag_window       = 24
aim_diag_warn_flips   = 5
human_clutch_diag     = True
human_clutch_diag_interval_sec = 0.25
pipeline_latency_log  = True
pipeline_latency_interval_sec = 1.0


# ═══════════════════════════════════════════════════════════════════════════════
#  Test —— 仿真/评测（不影响实战 agent.py）
#
#  所有 CV 噪声/延迟模型的内部参数已移入代码默认值。
#  如需调整测试场景的物理保真度，运行 `python test/simulation.py --help` 查看。
# ═══════════════════════════════════════════════════════════════════════════════
[Test]
# 仿真延迟注入
simulate_stream_latency    = True       # True=注入模拟串流延迟
simulate_inference_latency = True       # True=注入模拟推理延迟
print_stream_latency_stats = True

# 零延迟测试模式（True=忽略 moonlight/base_hardware_lag，只测纯管线）
align_worldmodel_to_zero_sim_delay = True

# pure_ai 拟人反应延迟(s)：0=纯 AI 无延迟评测真实 TTK；0.15=模拟人类认知延迟
pure_ai_reaction_ramp_sec = 0.0
