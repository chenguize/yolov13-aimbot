# =========================================================
#  AIMBOT SYSTEM CONFIG  (LQR v4 - CMA-ES 最优参数 得分31.96)
#  生成日期: 基于 2026-02-27 炼丹结果
# =========================================================

[General]
screen_width           = 1920
screen_height          = 1080
capture_size           = 256
capture_fps_target     = 240
# 低于此 ctx.conf 不 compute（与 Inference.conf 配合调）
min_aim_conf           = 0.32
enable_aimbot          = True
enable_triggerbot      = True

# =========================================================
#  Inference
# =========================================================
[Inference]
model_path             = models/best256_yolo26.engine
conf_threshold         = 0.38
iou_threshold          = 0.45
max_det                = 20

# =========================================================
#  Kalman Filter (保持原值或上次较好值，未在此轮炼丹覆盖)
# =========================================================
[Kalman]
R                      = 1.726028
Q_pos                  = 10.4587
Q_vel                  = 49.8483
Q_acc                  = 252.0694

# =========================================================
#  World Model
# =========================================================
[WorldModel]
base_hardware_lag      = 0.019
moonlight_latency_ms   = 0.0
virtualhere_latency_ms = 0.0

# =========================================================
#  Aim Strategy
# =========================================================
[AimStrategy]
strategy_package       = valorant
enable_auto_calibration = False
# 桌面/图片调试：为 True 时绕开本文件 FOV 非线性 + k_factor，等效 1 像素 = 1 count（正逆变换对称）
bypass_strategy_mapping = False
k_factor_x             = 3.35
k_factor_y             = 3.35
fixed_lead_time        = 0.019

# =========================================================
#  Controller (PROController LQR v4 - CMA-ES 最优参数)
# =========================================================
[Controller]
controller_type        = pro

# 物理与极限
max_accel              = 126684.7
max_speed              = 9523.1

# 拟人手腕阻尼 (抑制高频颤抖的核心)
wrist_alpha            = 0.2207

# 生理反应硬直
coldstart_ramp_ms      = 89.5

# LQR TRACK 大脑刚性配置
q_pos_track            = 31.3720
q_vel_track            = 0.6658
r_track                = 5.7226e-05

# LQR FLICK 甩枪刚性配置
q_pos_flick            = 12.7504
q_vel_flick            = 3.0968e-04
r_flick                = 1.1982e-07

# LQI 积分与辅助动力学
ki_gain                = 0.0205
ff_acc_gain            = 0.1465
blend_dist             = 50.0
deadzone_scale         = 0.1177
velocity_friction      = 0.9805

# Flick 结束时的手刹阻尼
flick_end_damp         = 0.30
cipher_b_correction = 0.347466
cipher_b_pursuit = 0.478909
cipher_deadzone_scale = 0.0543274
cipher_drift_pos_scale = 0.0150172
cipher_drift_sigma = 0.134068
cipher_ff_acc_sec = 0.0115975
cipher_ff_gain = 0.920701
cipher_ff_scale_min = 0.557122
cipher_ff_speed_knee = 471.822
cipher_ff_speed_scale = 2605.17
cipher_fitts_T_max = 0.254414
cipher_fitts_T_min = 0.039363
cipher_fitts_a = 0.0255054
cipher_fitts_b = 0.0434261
cipher_fitts_sigma = 0.0524954
cipher_k_correction = 86.1121
cipher_k_flick = 510.808
cipher_k_pursuit = 211.857
cipher_max_speed = 6611.19
cipher_ou_sigma_ball = 0.291988
cipher_ou_sigma_track = 0.236835
cipher_ou_vel_scale = 154.396
cipher_prog_interval = 0.0715009
cipher_ramp_min = 0.827343
cipher_ramp_ms = 32.6839
cipher_tau_arm = 0.00950206
cipher_tau_wrist = 0.00521091
cipher_thresh_high_px = 43.5954
cipher_thresh_low_px = 41.4867
cipher_undershoot_loc = 0.0253808
cipher_undershoot_sigma = 2.29363

# =========================================================
#  Triggerbot
# =========================================================
[Triggerbot]
trigger_fov_x          = 4.0
trigger_fov_y          = 4.0
trigger_conf_threshold = 0.50

# =========================================================
#  Debug
# =========================================================
[Debug]
enable_trace           = False
# 根日志等级：DEBUG 可看到无检测帧、子模块 detail；主流程用 INFO 即可
log_level              = INFO
# 启动时打印 python 路径、config.ini 路径、Runtime 门限、管线说明
startup_diag           = True
# 约每 1s 一条：附带 valid / dets / infer_ema / paused / aim_on，便于对照「是否锁到框」
detailed_stats         = True
# 主循环等 frame_ready 的最长时间（秒）；超时打 WARNING 并短暂 sleep，避免采图/推理卡死时整进程假死。0=无限等（调试用，不推荐）
tick_wait_timeout_sec  = 2.0